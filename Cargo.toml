[package]
name = "system_diagnostic_tool"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sys_diag"
path = "src/main.rs"

[dependencies]
eframe      = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
nalgebra = "0.35.0"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1"
